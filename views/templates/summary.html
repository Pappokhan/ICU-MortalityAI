<div class="icu-band icu-band--$band_key">
  <div class="icu-band__label">$band_label</div>
  <div class="icu-band__text">Federated ensemble · $band_text</div>
</div>
<div class="icu-cards">
  <div class="icu-card">
    <div class="icu-card__title">Central XGBoost</div>
    <div class="icu-card__value">$p_central</div>
    <span class="icu-badge icu-badge--$central_key">$central_label</span>
  </div>
  <div class="icu-card">
    <div class="icu-card__title">Federated ensemble</div>
    <div class="icu-card__value">$p_fl</div>
    <span class="icu-badge icu-badge--$band_key">$band_label</span>
  </div>
  <div class="icu-card">
    <div class="icu-card__title">Partition consensus</div>
    <div class="icu-card__value">$agree / $n_clients</div>
    <span class="icu-badge icu-badge--neutral">$consensus_text</span>
  </div>
</div>
